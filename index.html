/* ================== HELPERS ================== */
const SW = 512;

function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function buildStrip(SH, heightFn, pixFn) {

  const tops = new Int16Array(SW);
  for (let i = 0; i < SW; i++) {

    for (let j = Math.max(0, top); j < SH; j++) {
      const col = pixFn(i, j, j - top);
      if (!col) continue;
      const k = (j * SW + i) * 4; d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = 255;

}
function buildBody(w, h, fn) {
  const c = mk(w, h);
  const x = c.getContext('2d'); const img = x.createImageData(w, h); const d = img.data;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const col = fn(i, j); if (!col) continue;
    const k = (j * w + i) * 4; d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = 255;
  }
  x.putImageData(img, 0, 0);

}
function bodySun(coreC, edgeC, glowC) {
  const core = P(coreC), edge = P(edgeC), g1 = P(glowC);
  return buildBody(48, 48, (i, j) => {
    const dx = i + 0.5 - 24, dy = j + 0.5 - 24, d = Math.sqrt(dx * dx + dy * dy);

}
function bodyMoon() {
  const g = P('#f4f0dc'), dk = P('#cfc8a8');

function buildCloud(w, h, seed, col, shade) {
  const r = rng(seed), blobs = [];

function cloudSet(col, shade) { return [buildCloud(46, 16, 3, col, shade), buildCloud(30, 12, 8, col, shade), buildCloud(64, 20, 15, col, shade)]; }

/* ---------- far layers (drawn with canvas primitives) ---------- */
function farCanvas(SH, draw) { const c = mk(SW, SH); const x = c.getContext('2d'); draw(x, SH); return { c, tops: new Int16Array(SW), SH }; }

}
function fir(x, cx, by, h, col, trunk) {

function farNordsee() {

function update() {
  frame++;

  if (banner) { banner.t++; if (banner.t > 170) banner = null; }
  if (state === 'paused') return;

  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.x += q.vx; q.y += q.vy; q.vy += q.g; q.vx *= 0.985; q.life--;
    if (q.life <= 0) parts.splice(i, 1);
  }
  if (state === 'name') { idleOnRoad(); return; }
  if (state === 'start') {
    idleOnRoad();

    return;
  }
  if (state === 'over') { overT++; if (DEMO && overT > 150) flap(); return; }

  const D = difficulty(); speed = D.speed;
  dist += speed;
  ship.vy = Math.min(ship.vy + GRAV, 8.5);
  ship.y += ship.vy;
  const ta = clamp(ship.vy * 0.05, -0.32, 0.45);
  ship.ang += (ta - ship.ang) * 0.22;
  if (ship.thrust > 0) { ship.thrust--; if (ship.thrust % 2 === 0) sparks(2); }
  if (frame % 4 === 0) puff();

  for (const p of pairs) { p.x -= speed; if (p.amp) p.cy = p.baseY + Math.sin(p.ph + frame * 0.03) * p.amp; }
  while (pairs.length && pairs[0].x < -TW - 20) pairs.shift();
  const lastX = pairs.length ? pairs[pairs.length - 1].x : -1e9;
  if (!pairs.length) spawnPair(W + 80);
  else if (lastX < W + 20 - D.spacing) spawnPair(lastX + D.spacing);

  if (DEMO) {
    let tgt = H * 0.45;
    for (const p of pairs) if (p.x + TW + 6 > ship.x - 34) { tgt = p.cy + 8; break; }
    if (ship.y + ship.vy * 3 > tgt && ship.vy > -1.5) flap();
  }

  for (const p of pairs) {
    if (!p.scored && p.x + TW < ship.x - 32) {
      p.scored = true; score++; sfx.score();
      const li = Math.floor(score / 10);
      if (li !== levelIdx) { prevLevel = levelIdx; levelIdx = li; fade = 0; showBanner(); sfx.level(); }
    }
  }

  const pts = [];
  for (const ox of [-26, -9, 9, 26]) for (const oy of [-7, 7]) pts.push(local(ox, oy));
  for (const [px, py] of pts) {
    if (py < 6) return crash('FUNKLOCH ÜBER DEN WOLKEN!');
    if (py + 7 > groundTopAt(px)) return crash('BRUCHLANDUNG ' + levelOf(levelIdx).short + '!');
  }
  for (const p of pairs) {
    if (p.x > ship.x + 42 || p.x + TW + 8 < ship.x - 42) continue;
    for (const r of pairRects(p)) for (const [px, py] of pts) {
      if (circleRect(px, py, 7, r[0], r[1], r[2], r[3])) return crash('AUSGEBREMST VON ' + p.comp.n + '!');
    }
  }
}

  if (overT < 6) { ctx.fillStyle = 'rgba(255,255,255,' + (0.6 - overT * 0.1) + ')'; ctx.fillRect(0, 0, W, H); }
  if (overT < 24) return;
  const pw = Math.min(W - 12, 270), px = Math.round(W / 2 - pw / 2), py = 52, ph = 306;
  panel(px, py, pw, ph, '#E20074');
  drawText('VERBINDUNG ABGEBROCHEN!', W / 2, py + 10, 2, '#ff4fa8', 'center', '#000');
  drawText(killer, W / 2, py + 28, 1, '#ffe066', 'center');
  drawText('SPIELER: ' + playerName, W / 2, py + 42, 1, '#ffffff', 'center');
  drawText('PUNKTE', px + 20, py + 58, 2, '#ffffff');
  drawText(String(score), px + pw - 20, py + 58, 2, '#ffffff', 'right');
  drawText('REKORD', px + 20, py + 76, 2, '#ff9a1f');
  drawText(String(best), px + pw - 20, py + 76, 2, '#ff9a1f', 'right');
  drawText('ERREICHT: ' + levelOf(levelIdx).name, W / 2, py + 96, 1, levelOf(levelIdx).accent, 'center');
  if (newBest && Math.floor(frame / 15) % 2 === 0) drawText('NEUER REKORD!', W / 2, py + 108, 2, '#ffe066', 'center', '#5a0030');
  ctx.fillStyle = '#E20074'; ctx.fillRect(px + 10, py + 126, pw - 20, 1);
  drawLeaderboard(px, py + 134, pw, 10);
  if (overT > 35 && Math.floor(frame / 30) % 2 === 0) drawText('TIPPEN / LEERTASTE: NEUSTART', W / 2, py + ph + 10, 1, '#ffffff', 'center', '#000');
  drawNameButton(py + ph + 24);
}
function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
  drawText('PAUSE', W / 2, H / 2 - 30, 5, '#ffffff', 'center', '#3b3f46');
  drawText('P ODER TIPPEN ZUM FORTSETZEN', W / 2, H / 2 + 6, 1, '#ffe066', 'center');
}
function render() {
  nameBtn = null;
  layered(drawBackdrop);
  for (const p of pairs) drawPair(p);
  layered(drawNear);
  for (const p of pairs) drawTaunt(p);
  if (state !== 'over') drawTruck();
  drawParts();
  drawBanner();
  drawHUD();
  if (state === 'name') drawNameScreen();
  if (state === 'start') drawStart();
  if (state === 'over') drawOver();
  if (state === 'paused') drawPause();

  sctx.fillStyle = '#000'; sctx.fillRect(0, 0, screen.width, screen.height);
  const sx = shake ? Math.round((Math.random() * 2 - 1) * shake) * dispScale : 0;
  const sy = shake ? Math.round((Math.random() * 2 - 1) * shake) * dispScale : 0;
  sctx.imageSmoothingEnabled = false;
  sctx.drawImage(game, offX + sx, offY + sy, Math.round(W * dispScale), Math.round(H * dispScale));
}

/* ================== NAME ENTRY (HTML overlay) ================== */
const nameBox = document.getElementById('nameBox');
const nameInput = document.getElementById('nameInput');
const nameOk = document.getElementById('nameOk');
function positionNameBox() {
  if (!nameBox) return;
  const cs = dispScale / dpr;
  const w = Math.min(Math.max(220, 220 * cs), 340, window.innerWidth - 24);
  const cx = offX / dpr + (W / 2) * cs, top = offY / dpr + 184 * cs;
  nameBox.style.width = w + 'px';
  nameBox.style.left = Math.round(cx - w / 2) + 'px';
  nameBox.style.top = Math.round(top) + 'px';
  nameBox.style.height = Math.round(Math.max(44, 44 * cs * 0.75)) + 'px';
}
function openNameEntry() {
  state = 'name';
  nameInput.value = playerName;
  nameBox.style.display = 'flex';
  positionNameBox();
  setTimeout(() => { try { nameInput.focus(); nameInput.select(); } catch (e) {} }, 30);
}
function confirmName() {
  const n = cleanName(nameInput.value).trim();
  if (!n) { nameInput.style.borderColor = '#ff2a2a'; setTimeout(() => { nameInput.style.borderColor = ''; }, 400); try { nameInput.focus(); } catch (e) {} return; }
  playerName = n; ls.set('rff_name', n);
  nameBox.style.display = 'none';
  try { nameInput.blur(); } catch (e) {}
  ensureAudio(); sfx.hello();
  state = 'start';
  refreshTop();
  setTimeout(resize, 300);
}
nameInput.addEventListener('input', () => { const p = nameInput.selectionStart; const v = cleanName(nameInput.value); if (v !== nameInput.value) { nameInput.value = v; try { nameInput.setSelectionRange(p, p); } catch (e) {} } });
nameInput.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); confirmName(); } });
nameOk.addEventListener('click', e => { e.preventDefault(); confirmName(); });
nameBox.addEventListener('pointerdown', e => e.stopPropagation());

/* ================== INPUT ================== */
function toGame(e) {
  const r = screen.getBoundingClientRect();
  return { x: ((e.clientX - r.left) * dpr - offX) / dispScale, y: ((e.clientY - r.top) * dpr - offY) / dispScale };
}
const inBtn = (p, b) => b && p.x >= b.x - 3 && p.x <= b.x + b.w + 3 && p.y >= b.y - 3 && p.y <= b.y + b.h + 3;
screen.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = toGame(e);
  if (inBtn(p, muteBtn())) { toggleMute(); return; }
  if (state === 'name') { try { nameInput.focus(); } catch (err) {} return; }
  if ((state === 'start' || (state === 'over' && overT > 24)) && inBtn(p, nameBtn)) { sfx.click(); openNameEntry(); return; }
  if ((state === 'play' || state === 'paused') && inBtn(p, pauseBtn())) { ensureAudio(); togglePause(); return; }
  if (state === 'paused') { togglePause(); return; }
  flap();
}, { passive: false });
screen.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
screen.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (state === 'name' || e.target === nameInput) return;
  const k = e.code;
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW' || k === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    if (state === 'paused') { togglePause(); return; }
    flap();
  } else if (k === 'KeyM') { toggleMute(); }
  else if (k === 'KeyN') { if (state === 'start' || state === 'over') { e.preventDefault(); openNameEntry(); } }
  else if (k === 'KeyP' || k === 'Escape') { if (state === 'play' || state === 'paused') togglePause(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'paused'; });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

/* ================== LOOP ================== */
buildLevels();
TRUCK = buildTruck();
resize();
if (START_SCORE) levelIdx = Math.floor(START_SCORE / 10);
refreshTop();
if (state === 'name') openNameEntry();
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  let dt = now - last; last = now;
  if (dt > 250) dt = 250;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 6) { update(); acc -= STEP; n++; }
  if (n === 6) acc = 0;
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__rff = { get state() { return state; }, get score() { return score; }, get level() { return levelOf(levelIdx).name; }, get name() { return playerName; }, get top() { return topList; }, flap };
})();
</script>
